[package]
name = "sjml-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust guest SDK for the Somuch Java Mod Loader ABI"
repository.workspace = true
documentation = "https://docs.rs/sjml-sdk"
readme = "README.md"

[lib]
name = "sjml"
crate-type = ["rlib", "cdylib"]

[[example]]
name = "guest"
crate-type = ["cdylib"]

[[example]]
name = "gametest"
crate-type = ["cdylib"]

[[example]]
name = "smithing_transform"
crate-type = ["cdylib"]

[[example]]
name = "gui_layer_replacement"
crate-type = ["cdylib"]

[[example]]
name = "client_screen_multi_select"
crate-type = ["cdylib"]

[[example]]
name = "client_cursor_moved"
crate-type = ["cdylib"]

[[example]]
name = "player_equipment_changed"
crate-type = ["cdylib"]

[[example]]
name = "player_system_message"
crate-type = ["cdylib"]

[[example]]
name = "player_rich_system_message"
crate-type = ["cdylib"]

[[example]]
name = "block_drops_attempt"
crate-type = ["cdylib"]

[[example]]
name = "player_experience_change_attempt"
crate-type = ["cdylib"]

[[example]]
name = "player_experience_level_change_attempt"
crate-type = ["cdylib"]

[dependencies]
sjml-macros.workspace = true
