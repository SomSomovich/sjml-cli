[package]
name = "sjml-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Som_Somovich"]
description = "Build, validate, and package SJML Rust guest projects"
repository = "https://github.com/SomSomovich/sjml-cli"
readme = "README.md"
include = [
    "src/**",
    "tests/cli.rs",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "docs/**",
]

[workspace]
members = ["sjml-sdk", "sjml-macros"]
resolver = "2"

[workspace.package]
version = "0.40.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/SomSomovich/sjml-cli"

[workspace.dependencies]
sjml-macros = { path = "sjml-macros", version = "0.40.0" }

[[bin]]
name = "sjml-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.23"
sha2 = "0.10.9"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
unicode-normalization = "0.1.25"
base64 = "0.22"
wasmparser = "0.245.1"
tempfile = "3.24.0"
